<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ProToolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body {
            background-color: #030712;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-lg w-full glass-panel p-8 md:p-10 rounded-3xl shadow-2xl">
        <div class="flex items-center gap-3 mb-6 text-center justify-center">
            <div class="w-10 h-10 bg-purple-600/20 rounded-xl flex items-center justify-center border border-purple-500/30">
                <i data-lucide="mail" class="text-purple-400 w-6 h-6"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Contact Us</h1>
        </div>
        
        <p class="text-slate-400 text-center text-sm mb-10">Humein batayein agar aapko koi sawaal ya sujhaav hai. Niche details bharein aur humein mail karein.</p>

        <!-- Script to Handle Email Opening -->
        <form class="space-y-5" id="contactForm">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Aapka Naam</label>
                <input type="text" id="name" required placeholder="Full Name" class="w-full bg-slate-900/50 border border-white/10 p-3.5 rounded-xl outline-none focus:border-purple-500 text-white transition-all">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Email Address</label>
                <input type="email" id="email" required placeholder="example@mail.com" class="w-full bg-slate-900/50 border border-white/10 p-3.5 rounded-xl outline-none focus:border-purple-500 text-white transition-all">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Message</label>
                <textarea id="message" rows="4" required placeholder="Apna message likhein..." class="w-full bg-slate-900/50 border border-white/10 p-3.5 rounded-xl outline-none focus:border-purple-500 text-white transition-all"></textarea>
            </div>
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 py-4 rounded-xl font-bold text-white shadow-lg shadow-purple-500/20 transition-all flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-4 h-4"></i>
                Send Us
            </button>
        </form>

        <div class="mt-10 pt-6 border-t border-white/10 text-center">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white font-semibold transition-all group">
                <i data-lucide="chevron-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                Back to Home App
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Email sending logic
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            const targetEmail = "pks3342274@gmail.com";
            const subject = encodeURIComponent("ProToolkit Query from " + name);
            const body = encodeURIComponent("Namaste,\n\nMujhe ProToolkit ke baare mein ye query hai:\n\n" + message + "\n\nRegards,\n" + name + "\nEmail: " + email);
            
            // Construct mailto link and open it
            window.location.href = `mailto:${targetEmail}?subject=${subject}&body=${body}`;
        });
    </script>
</body>
</html>
